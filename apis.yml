aid: g-p
name: G-P
description: G-P (Globalization Partners) is the recognized leader in global employment,
  providing a comprehensive platform to hire, manage, and pay employees and contractors
  in 180+ countries without setting up local entities. Their REST APIs enable companies
  to automate HR workflows, manage employment contracts, benefits, payroll, and compliance
  across international teams through EOR (Employer of Record) and Contractor products.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/g-p/refs/heads/main/apis.yml
created: '2026-06-13'
modified: '2026-06-13'
specificationVersion: '0.19'
tags:
  - Global Employment
  - Employer of Record
  - EOR
  - Payroll
  - HR
  - Compliance
  - Contractors
  - International Hiring
apis:
  - aid: g-p:g-p-authentication-api
    name: G-P Authentication API
    description: Securely verifies client identity and issues access tokens via OAuth
      2.0 client credentials grant for authenticating requests to all G-P APIs.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://developer.g-p.com/apis/authentication-1/docs
    baseURL: https://api.g-p.com/api
    tags:
      - Authentication
      - OAuth
      - Access Tokens
    properties:
      - type: Documentation
        url: https://developer.g-p.com/apis/authentication-1/docs
      - type: OpenAPI
        url: https://developer.g-p.com/apis/authentication-1/docs
  - aid: g-p:g-p-eor-api
    name: G-P EOR API
    description: Provides capabilities for accessing and managing employee and employment
      data within the G-P Employer of Record (EOR) product, including international
      hires, employment contracts, benefits, and compliance across 180+ countries.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://developer.g-p.com/apis/eor/docs
    baseURL: https://api.g-p.com/api
    tags:
      - EOR
      - Employees
      - Employment
      - Compliance
      - Benefits
      - Payroll
    properties:
      - type: Documentation
        url: https://developer.g-p.com/apis/eor/docs
      - type: OpenAPI
        url: https://developer.g-p.com/apis/eor/docs
  - aid: g-p:g-p-contractor-api
    name: G-P Contractor API
    description: API set for accessing and managing detailed Contractor information,
      enabling companies to onboard, manage, and pay international contractors compliantly
      through the G-P platform.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://developer.g-p.com/apis/contractor/docs
    baseURL: https://api.g-p.com/api/contractor
    tags:
      - Contractors
      - Independent Contractors
      - Global Hiring
    properties:
      - type: Documentation
        url: https://developer.g-p.com/apis/contractor/docs
      - type: OpenAPI
        url: https://developer.g-p.com/apis/contractor/docs
